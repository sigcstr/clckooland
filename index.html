<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<style>

</style></head><body>
<div id="stage"><div id="world"></div></div>
<div id="full"><canvas id="cv"></canvas><button id="x" aria-label="닫기">✕</button></div>
<div id="fr"></div>
<video id="cam" playsinline muted></video>
<div id="hint"></div>
<script>
const IMGS=["images/01.jpg", "images/02.jpg", "images/03.jpg", "images/04.jpg", "images/05.jpg", "images/06.jpg", "images/07.jpg", "images/08.jpg", "images/09.jpg", "images/10.jpg", "images/11.jpg", "images/12.jpg", "images/13.jpg"];
const $=i=>document.getElementById(i),world=$('world'),stage=$('stage'),hint=$('hint'),full=$('full'),cv=$('cv'),cx=cv.getContext('2d'),fr=$('fr'),cam=$('cam');
const bs=document.createElement('canvas'),bx=bs.getContext('2d');
const n=IMGS.length,Sp=()=>Math.min(innerWidth,innerHeight),S=v=>`calc(var(--S)*${v.toFixed(4)})`,DPR=Math.min(devicePixelRatio||1,2);

let ht;function say(t){hint.textContent=t;hint.style.opacity=1;clearTimeout(ht);ht=setTimeout(()=>hint.style.opacity=0,2800)}
say('드래그해서 돌려보세요 · 사진을 누르면 크게 보여요');
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

const R=.52,order=[],TL=[];

let ti=0;

  const V=[[sx*R,0,0],[0,sy*R,0],[0,0,sz*R]],c=[0,1,2].map(a=>(V[0][a]+V[1][a]+V[2][a])/3),nr=[sx,sy,sz].map(v=>v/Math.sqrt(3));

    const el=document.createElement('div');el.className='tile';
    el.style.width=S(w);el.style.height=S(h);el.style.margin=`${S(-h/2)} 0 0 ${S(-w/2)}`;
    const tr=`translate3d(${S(p[0])},${S(p[1])},${S(p[2])}) rotateY(${yaw.toFixed(1)}deg) rotateX(${pit.toFixed(1)}deg) rotateZ(${roll.toFixed(1)}deg)`;el.style.transform=tr;

    const im=new Image();im.src=IMGS[idx];im.alt='';im.draggable=false;
    const op=`${(rnd()*100).toFixed(0)}% ${(rnd()*100).toFixed(0)}%`,tf=`scale(${(1+rnd()*.5).toFixed(2)})`;im.style.objectPosition=op;im.style.transform=tf;
    f.appendChild(im);el.appendChild(f);el._t={p,yaw,pit,roll,w,h,idx,op,tf,tr,opx:parseFloat(op),opy:parseFloat(op.split(' ')[1]),scv:parseFloat(tf.slice(6))};world.appendChild(el);TL.push(el);
  }
}
// ── 카메라 상태 / 트윈
const st={rx:-12,ry:20,rz:0,tx:0,ty:0,tz:0,zoom:.72},K=['rx','ry','rz','tx','ty','tz','zoom'];
let vx=0,vy=0,drag=false,lx=0,ly=0,idle=0,mode='free',saved=null,anim=null,sx0=0,sy0=0,clickOK=false,cur=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;
    for(let i=0;i<8;i++){const d=X(t)-x,g=dX(t);if(Math.abs(d)<1e-5||Math.abs(g)<1e-6)break;t-=d/g}
    if(!(t>=0&&t<=1)||Math.abs(X(t)-x)>1e-4){let lo=0,hi=1;t=x;while(hi-lo>1e-5){X(t)<x?lo=t:hi=t;t=(lo+hi)/2}}
    return Y(t)}}
const ease=bez(.7,0,.2,1);
function apply(){world.style.transform=`scale(${st.zoom}) rotateZ(${st.rz}deg) rotateX(${st.rx}deg) rotateY(${st.ry}deg) translate3d(${st.tx}px,${st.ty}px,${st.tz}px)`}

// ── 개별 이미지로 이동 (페이드 없이 바로 전환)
let fEl=null;
// 타일 상태(S 단위): 크기·크롭 위치·확대·앞으로 튀어나오는 깊이
const baseK=o=>({w:o.w,h:o.h,ox:o.opx,oy:o.opy,sc:o.scv,z:0}),
  heroK=o=>{const vr=innerWidth/innerHeight,tw=Math.sqrt(o.w*o.h*vr);return{w:tw,h:tw/vr,ox:50,oy:50,sc:1,z:.02}}, // 화면 비율 + 가운데 크롭 = 원본 화면과 동일한 모습
  lerpK=(a,b,e)=>({w:a.w+(b.w-a.w)*e,h:a.h+(b.h-a.h)*e,ox:a.ox+(b.ox-a.ox)*e,oy:a.oy+(b.oy-a.oy)*e,sc:a.sc+(b.sc-a.sc)*e,z:a.z+(b.z-a.z)*e});
function applyTile(el,k,px){const im=el.firstChild.firstChild,s=Sp(),o=el._t,L=px?v=>`${(v*s).toFixed(2)}px`:v=>S(v);
  el.style.width=L(k.w);el.style.height=L(k.h);el.style.margin=`${L(-k.h/2)} 0 0 ${L(-k.w/2)}`;
  im.style.objectPosition=`${k.ox.toFixed(2)}% ${k.oy.toFixed(2)}%`;im.style.transform=`scale(${k.sc.toFixed(4)})`;
  el.style.transform=k.z>1e-5?o.tr+` translateZ(${L(k.z)})`:o.tr}
function goTo(el,first){
  if(first)saved={...st};
  const prev=fEl;fEl=el;mode='anim';vx=vy=0;endStroke();full.classList.remove('on');cur=TL.indexOf(el);
  const o=el._t,s=Sp(),vr=innerWidth/innerHeight,tw=Math.sqrt(o.w*o.h*vr),P0=1.6*s,nu=.02*s,im=pics[o.idx];
  const start=()=>{prep(o.idx); // 원본 캔버스를 이동 시작 전에 미리 그려둬서 도착 순간 끊김이 없게
    const ms=[{el,from:baseK(o),to:heroK(o)}];if(prev&&prev!==el)ms.push({el:prev,from:heroK(prev._t),to:baseK(prev._t)});
    tween({rx:-o.pit,ry:-o.yaw,rz:-o.roll,tx:-o.p[0]*s,ty:-o.p[1]*s,tz:-o.p[2]*s,zoom:innerWidth*P0/(tw*s*P0+innerWidth*nu)},DUR,
      ()=>{mode='focus';reveal();if(fl&&!goTo.h){goTo.h=1;say('눈을 깜빡이면 글리치가 생겨요')}},ms)};
  (im.decode?im.decode().catch(()=>{}):Promise.resolve()).then(start)}
function nav(d){if(mode==='focus')goTo(TL[(cur+d+TL.length)%TL.length],false)}
function closeFull(){if(mode!=='focus')return;endStroke();mode='anim';full.classList.remove('on');fr.style.display='none';
  const el=fEl;fEl=null;tween({...saved},DUR,()=>{mode='free';idle=0;vx=vy=0},el?[{el,from:heroK(el._t),to:baseK(el._t)}]:[])} // 같은 화면에서 축소되며 3D로 복귀
function focusCenter(){
  const f=document.elementsFromPoint(innerWidth/2,innerHeight/2).find(x=>x.classList&&x.classList.contains('f'));let el=f&&f.parentNode;
  if(!el){let b=1e9;TL.forEach(t=>{const r=t.getBoundingClientRect(),d=Math.hypot(r.left+r.width/2-innerWidth/2,r.top+r.height/2-innerHeight/2);if(d<b){b=d;el=t}})}
  goTo(el,true)}
// ── 편집 캔버스 (원본 해상도로 화면 비율에 꽉 채움)
let W=0,H=0;
function prep(idx){
  W=cv.width=bs.width=Math.round(innerWidth*DPR);H=cv.height=bs.height=Math.round(innerHeight*DPR);
  const im=pics[idx],s=Math.max(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;
  cx.drawImage(im,(W-w)/2,(H-h)/2,w,h);bx.drawImage(cv,0,0)}
const reveal=()=>full.classList.add('on');
const commit=()=>bx.drawImage(cv,0,0);
function stretch(a,f,vert){cx.drawImage(bs,0,0);
  if(vert){const y=Math.min(H-1,Math.max(0,a|0));cx.drawImage(bs,0,y,W,1,0,Math.min(a,f),W,Math.abs(f-a)+1)}
  else{const x=Math.min(W-1,Math.max(0,a|0));cx.drawImage(bs,x,0,1,H,Math.min(a,f),0,Math.abs(f-a)+1,H)}}
// ── 글리치 효과: 작은 정사각형 안을 JPEG 깨진 듯한 저화질 모자이크로 (블록 평균색 + 어긋난 블록 + 가로 번짐)
const tc=document.createElement('canvas'),tx=tc.getContext('2d');tc.width=tc.height=1;

let glBusy=false;
const rg=(a,b)=>a+Math.random()*(b-a);
function avgFill(sx,sy,w,h,dx,dy,dw,dh){ // 영역 평균색으로 한 칸을 채움

    else avgFill(dx+sh,dy+sj,c,c,dx,dy,c+.5,c+.5)}

    const bh=Math.max(3,Math.round(c*rg(.25,.7))),by=Math.round(rg(0,s-bh)),sx=Math.round(rg(0,W-1));
    cx.drawImage(bs,sx,Math.min(H-bh,y+by),1,bh,x,y+by,s,bh)}

    const gw=c*rg(1.2,2.2),gh=c*rg(.8,1.3),gx0=x+rg(0,s-gw),gy0=y+rg(0,s-gh);

function glitch(x,y,s){
  if(glBusy||!W)return;

    else{commit();glBusy=false}})(t0)}
function randomGlitch(){const s=Math.round(defSize()*(.85+Math.random()*.4));glitch(Math.random()*(W-s),Math.random()*(H-s),s)}
const frame=(x,y,w,h)=>{fr.style.cssText=`display:block;left:${x}px;top:${y}px;width:${w}px;height:${h}px`};
// 마우스 편집: 드래그=스트레치, Shift+드래그(또는 Shift+클릭)=글리치 정사각형
let ms=null;
cv.addEventListener('pointerdown',e=>{ms={x:e.clientX,y:e.clientY,axis:null};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!ms)return;const dx=e.clientX-ms.x,dy=e.clientY-ms.y;
  if(e.shiftKey){const sd=Math.max(Math.abs(dx),Math.abs(dy));ms.r=[dx>=0?ms.x:ms.x-sd,dy>=0?ms.y:ms.y-sd,sd,sd];frame(...ms.r);return}

$('x').addEventListener('click',closeFull);
addEventListener('keydown',e=>{if(e.key==='Escape')closeFull();if(e.key==='ArrowRight')nav(1);if(e.key==='ArrowLeft')nav(-1)});
// ── 마우스/터치: 회전·줌·클릭

  else{clickOK=false;const[a,b]=[...pts.values()];pd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});

  else{const p=[...pts.values()][0];lx=p.clientX;ly=p.clientY}};

stage.addEventListener('wheel',e=>{e.preventDefault();if(mode!=='free')return;st.zoom=Math.min(2.2,Math.max(.4,st.zoom*(e.deltaY<0?1.06:.94)))},{passive:false});
// ── 손 제스처
const G={tip:[],pin:[],sw:[],cool:0,fist:0,E:null,hist:[],eT:0,blink:{closed:false,t:0}};
function endStroke(){if(G.E){commit();G.E=null}}
function gesture(HS){

    if(h.e[0]&&h.e[1]&&!h.e[2]&&!h.e[3]){ // ✌️ 두 손가락을 상하좌우로 → 다른 사진 (왼쪽·위 = 다음, 오른쪽·아래 = 이전)
      const t={x:(h.m[8].x+h.m[12].x)/2,y:(h.m[8].y+h.m[12].y)/2};
      G.sw.push({t:now,x:t.x,y:t.y});while(G.sw[0].t<now-350)G.sw.shift();
      const dx=t.x-G.sw[0].x,dy=t.y-G.sw[0].y;
      if(now>G.cool&&Math.max(Math.abs(dx),Math.abs(dy))>.17){G.cool=now+800;G.sw=[];nav((Math.abs(dx)>Math.abs(dy)?dx:dy)<0?1:-1)}
    }else G.sw=[];
    const edgeNow=h.n>=2&&(h.edge||(G.E&&h.w<.8)); // 손날로 밀기 → 손날이 가로면 상하, 세로면 좌우로 픽셀 스트레치
    if(edgeNow){G.eT=now;const px=h.c.x*W,py=h.c.y*H;G.hist.push({x:px,y:py});if(G.hist.length>5)G.hist.shift();
      const o=G.hist[0],E=G.E,dx=px-o.x,dy=py-o.y,sp=Math.hypot(dx,dy);
      const bx_=(h.m[9].x-h.m[0].x)*W,by_=(h.m[9].y-h.m[0].y)*H,bl=Math.hypot(bx_,by_)||1; // 손날 방향 = 손목→중지 뿌리
      if(!E){if(sp>W*.02)G.E={ox:o.x,oy:o.y,ux:bx_/bl,uy:by_/bl,vert:Math.abs(by_)<=Math.abs(bx_),still:0}}
      else{E.ux+=(bx_/bl-E.ux)*.3;E.uy+=(by_/bl-E.uy)*.3;
        const ax=Math.abs(E.ux),ay=Math.abs(E.uy); // 손날이 가로(≈수평)면 상하 스트레치, 세로(≈수직)면 좌우 스트레치 (살짝 걸치면 유지)
        if(E.vert&&ay>ax*1.3)E.vert=false;else if(!E.vert&&ax>ay*1.3)E.vert=true;
        stretch(E.vert?E.oy:E.ox,E.vert?py:px,E.vert);
        if(sp<W*.008){E.still=E.still||now;if(now-E.still>400)endStroke()}else E.still=0}
    }else{if(G.E&&now-G.eT>250)endStroke();if(!G.E)G.hist=[]}
  }
}

function blinkCheck(r){
  const c=r&&r.faceBlendshapes&&r.faceBlendshapes[0]&&r.faceBlendshapes[0].categories;if(!c)return;
  const g=n=>(c.find(x=>x.categoryName===n)||{score:0}).score,v=(g('eyeBlinkLeft')+g('eyeBlinkRight'))/2,B=G.blink,now=performance.now();
  if(!B.closed&&v>.28){B.closed=true;if(now-B.t>450){B.t=now;randomGlitch()}}
  else if(B.closed&&v<.16)B.closed=false}
function track(){if(cam.readyState>=2&&cam.currentTime!==lastT){lastT=cam.currentTime;const ts=performance.now();
  if(lm)gesture(lm.detectForVideo(cam,ts).landmarks||[]);
  if(fl&&mode==='focus')blinkCheck(fl.detectForVideo(cam,ts))}requestAnimationFrame(track)}
async function startCam(){

    const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',{HandLandmarker:HL,FilesetResolver:FR}=await import(V+'/vision_bundle.mjs'),fs=await FR.forVisionTasks(V+'/wasm');
    const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:2});
    lm=await HL.createFromOptions(fs,o('GPU')).catch(()=>HL.createFromOptions(fs,o('CPU')));

  }catch(err){console.error(err);say('웹캠/손 인식을 쓸 수 없어요. 마우스로 사용해 주세요.')}}
async function lmFace(V,fs){
  const {FaceLandmarker:FL}=await import(V+'/vision_bundle.mjs'),o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:d},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});
  fl=await FL.createFromOptions(fs,o('GPU')).catch(()=>FL.createFromOptions(fs,o('CPU')))}
startCam();
(function loop(now){
